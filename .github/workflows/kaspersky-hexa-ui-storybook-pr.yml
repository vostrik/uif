name: "[storybook] @kaspersky/hexa-ui PR preview"

# Builds Storybook for every push to a pull request and publishes it to GitHub Pages:
# https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/kaspersky-hexa-ui/**'
      - '.github/workflows/kaspersky-hexa-ui-storybook-pr.yml'
  workflow_dispatch:

concurrency:
  group: storybook-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./packages/kaspersky-hexa-ui
    env:
      PREVIEW_DIR: pr-preview/pr-${{ github.event.pull_request.number || github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          # some lockfile entries point to an internal registry that is not reachable from GitHub runners
          sed -i -E 's#https://repository\.avp\.ru(:443)?/artifactory/api/npm/[^/]+/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --no-fund --ignore-scripts
          # babel.config.js uses babel packages that are installed only as dependencies of @kaspersky/dev-tools
          for dir in node_modules/@kaspersky/dev-tools/node_modules/@babel/*; do
            name=$(basename "$dir")
            [ -e "node_modules/@babel/$name" ] || ln -s "../@kaspersky/dev-tools/node_modules/@babel/$name" "node_modules/@babel/$name"
          done
          for dir in node_modules/@kaspersky/dev-tools/node_modules/babel-plugin-*; do
            name=$(basename "$dir")
            [ -e "node_modules/$name" ] || ln -s "@kaspersky/dev-tools/node_modules/$name" "node_modules/$name"
          done

      - name: Build Storybook
        shell: bash
        run: npx storybook build -o storybook-static --quiet

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/kaspersky-hexa-ui/storybook-static
          retention-days: 14

      - name: Deploy preview to GitHub Pages
        # pull requests from forks get a read-only token, the artifact above is still available for them
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/kaspersky-hexa-ui/storybook-static
          destination_dir: ${{ env.PREVIEW_DIR }}
          keep_files: true
          commit_message: "storybook preview: ${{ env.PREVIEW_DIR }}"

      - name: Comment preview link
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- storybook-pr-preview -->'
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
            const url = `https://${owner}.github.io/${repo}/${process.env.PREVIEW_DIR}/`
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              `📚 **Storybook preview:** ${url}`,
              '',
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · [build log and artifact](${runUrl})`,
              '_GitHub Pages may need a minute to publish the update._'
            ].join('\n')
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
